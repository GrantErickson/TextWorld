<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TextWorld</title>
    <!--
      Three bars of the glyph ramp, inline as a data URI.

      Declared rather than left implicit on purpose: with no icon tag a browser
      requests /favicon.ico at the *origin* root, which under a project page
      means granterickson.github.io/favicon.ico rather than .../TextWorld/ —
      a 404 in every visitor's console, and whatever icon a future user site
      publishes at that name would silently become this one's.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiI+PHJlY3Qgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2IiBmaWxsPSIjMGIwZjE2Ii8+PHJlY3QgeD0iMiIgeT0iMyIgd2lkdGg9IjMiIGhlaWdodD0iMTEiIGZpbGw9IiMyMzJjM2EiLz48cmVjdCB4PSI2IiB5PSI1IiB3aWR0aD0iMyIgaGVpZ2h0PSI5IiBmaWxsPSIjN2M4ODk5Ii8+PHJlY3QgeD0iMTAiIHk9IjciIHdpZHRoPSIzIiBoZWlnaHQ9IjciIGZpbGw9IiM2ZmQyYzAiLz48L3N2Zz4="
    />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <h1>TextWorld</h1>
        <span class="tag">character-cell raycaster</span>
        <div class="spacer"></div>
        <label class="ctl">
          cell size
          <input id="fontSize" type="range" min="8" max="26" step="1" value="14" />
          <output id="fontSizeOut">14</output>
        </label>
        <label class="ctl">
          glyphs
          <select id="glyphMode" title="Which characters surfaces are drawn with">
            <option value="blocks">blocks</option>
            <option value="ascii">ascii</option>
            <option value="material">material</option>
          </select>
        </label>
        <label class="ctl">
          contrast
          <input id="contrast" type="range" min="0.6" max="1.6" step="0.05" value="1" />
          <output id="contrastOut">1.00</output>
        </label>
        <label class="ctl checkbox">
          <input id="showRays" type="checkbox" /> rays
        </label>
        <label class="ctl checkbox">
          <input id="invertY" type="checkbox" /> invert Y
        </label>
        <button id="pauseBtn" class="btn" type="button">pause</button>
      </header>

      <main>
        <section id="view">
          <canvas id="screen"></canvas>
          <div id="clickToPlay"><span>click to capture mouse &middot; <kbd>Esc</kbd> releases</span></div>
        </section>

        <aside id="panel">
          <div class="pane">
            <h2>Map</h2>
            <canvas id="minimap"></canvas>
          </div>

          <div class="pane">
            <h2>Telemetry</h2>
            <div id="stats" class="stats"></div>
          </div>

          <div class="pane grow">
            <h2>
              World source
              <span class="pane-actions">
                <select id="presetSel" title="Load a built-in map"></select>
                <button id="revertBtn" class="btn tiny" type="button">revert</button>
              </span>
            </h2>
            <textarea id="src" spellcheck="false"></textarea>
            <div id="err" class="err"></div>
          </div>
        </aside>
      </main>

      <footer id="help">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &middot;
        <kbd>&larr;</kbd><kbd>&rarr;</kbd> or mouse turn &middot;
        <kbd>Shift</kbd> run &middot;
        <kbd>Space</kbd> jump &middot;
        <kbd>F</kbd> fly &middot;
        <kbd>E</kbd> open/close door &middot;
        <kbd>R</kbd> respawn &middot;
        <kbd>M</kbd> rays &middot;
        <kbd>G</kbd> glyph set &middot;
        <kbd>[</kbd><kbd>]</kbd> cell size
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
